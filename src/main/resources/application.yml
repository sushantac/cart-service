spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:ecommerce}?currentSchema=cart
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cart
        format_sql: true
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: cart

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ecommerce.*,com.company.orderapi.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ecommerce.cart.dto.OrderPlacedEvent

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:dev-secret-change-me-please-at-least-32chars-long-123}

  threads:
    virtual:
      enabled: true

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0

app:
  internal:
    api-key: ${INTERNAL_API_KEY:internal-service-key-12345}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-at-least-32chars-long-123}
  kafka:
    enabled: true
    topics:
      cart-checkout: cart.checkout.initiated
      order-placed: order.placed
